name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/providers/legacy/go.mod
          cache: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: System packages (Windows)
        if: runner.os == 'Windows'
        uses: AnimMouse/setup-ffmpeg@v1

      - name: FFmpeg is available
        run: ffmpeg -hide_banner -version | head -1

      - name: Python requirements
        run: python -m pip install -r requirements.txt

      - name: Build backends and bridge bundle
        run: python scripts/build_backends.py --bundle

      - name: Test suite
        run: |
          mkdir -p build
          python -m unittest discover -s tests -v 2>&1 | tail -60
          exit ${PIPESTATUS[0]}

      - name: Bridge bundle answers a request
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          from pathlib import Path
          name = "bridge.exe" if sys.platform == "win32" else "bridge"
          exe = Path("backend/bin/bridge") / name
          assets = Path("backend/bin/bridge/_internal/applemusicdecrypt/assets")
          for asset in ("pr_device.json", "device.wvd", "storefronts.json", "storefront_ids.json", "prefetch_template.json"):
              assert (assets / asset).is_file(), f"bridge bundle is missing {asset}"
          for wrapper, settings in (
              ("legacy", {"decrypt-m3u8-port": "127.0.0.1:1", "get-m3u8-port": "127.0.0.1:2"}),
              ("applemusicdecrypt", {"applemusicdecrypt-url": "http://127.0.0.1:1"}),
          ):
              request = {"version": 1, "request_id": "ci", "operation": "status", "wrapper": wrapper,
                         "settings": {"wrapper": wrapper, **settings}}
              result = subprocess.run([str(exe.resolve())], input=json.dumps(request), capture_output=True, text=True, timeout=120)
              events = [json.loads(line) for line in result.stdout.splitlines() if line.startswith("{")]
              print(wrapper, events[-2:])
              assert events and events[-1]["event"] == "complete", f"{wrapper}: bridge did not finish its protocol"
              assert any(e["event"] == "error" and e.get("code") == "wrapper_unavailable" for e in events), f"{wrapper}: expected an offline wrapper error"
          EOF

      - name: App starts
        run: |
          mkdir -p "$RUNNER_TEMP/appsmoke"
          cd "$RUNNER_TEMP/appsmoke"
          python - "$GITHUB_WORKSPACE/src/main.py" <<'EOF'
          import subprocess, sys, time
          process = subprocess.Popen([sys.executable, sys.argv[1]], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          time.sleep(20)
          alive = process.poll() is None
          process.kill()
          output = process.communicate()[0]
          print(output[-3000:])
          assert alive, "app exited during startup"
          assert "Traceback" not in output, "app logged a traceback"
          EOF

      - name: PowerShell launcher tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -File tests/test_wrapper_qemu.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -File tests/test_wrapper_ranges.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
